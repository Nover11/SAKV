[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakv"
version = "0.1.0"
description = "Semantic-aware KV cache compression for long-context LLM inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.7", "transformers==4.44.2", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["sakv*", "cake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
